# profiles/rov-vehicle/bridge.conf: the tether bridge on the lab's BlueROV2
# (docs/08-bridge.md, modules/bridge/README.md), opt-in: BRIDGE=1 rov.sh up
# (tools/rov/README.md "The topside on the laptop"). The same file as
# profiles/rov-topside/bridge.conf but for Peer=; rov.sh puts the tether's
# addresses (ROV_IP, GCS_IP) in at lay-out, and the key from ~/hangar-rov/.
[Bridge]
Pair=lab
Key=/etc/hangar/bridge.key
MsgDir=/usr/share/hangar/msg
Port=5614
Peer=192.168.2.1

[Mirror safety.state bridge.vehicle.link]
Direction=up
Priority=safety
ExpectRate=10
StaleAfter=300ms

[Mirror hangar.vehicle.system hangar.vehicle.modules]
Direction=up
Priority=safety
ExpectRate=1
StaleAfter=3s

[Mirror pilot.wrench pilot.buttons]
Direction=down
Priority=command
ExpectRate=50
StaleAfter=100ms
MaxAge=100ms

# What topside_mavlink re-emits to QGroundControl and the console shows.
[Mirror nav.* power.battery mux.state ardusub.state recorder.status]
Direction=up
Rate=10

[Mirror video.index]
Direction=up

[Mirror ardusub.param]
Direction=up
Delivery=reliable

[Calls]
Remote=safety.* mux.* recorder.* mavlink.setup

# tools/rov/lab.conf: what lab.sh needs to know about the lab, with the values of the
# lab's BlueROV2 at Yıldız Technical University. A copy in ~/.config/hangar/lab.conf is
# read first and wins; the environment wins over both (LAB_HOST=... lab.sh up). Each
# line sets a value only if nothing set it before, so keep the `: "${...:=...}"` form.

# The vehicle's Pi, over the Fathom-X tether. LAB_HOST=local runs everything on this
# laptop instead (a rehearsal without the vehicle: tools/rov/QUICKSTART.md).
: "${LAB_HOST:=192.168.2.10}"
: "${LAB_USER:=bluerov2}"

# This laptop's address on the tether: where the vehicle sends QGroundControl's MAVLink
# and the video.
: "${LAPTOP_IP:=192.168.2.1}"

# hangar's install on the Pi, relative to its user's home (or absolute).
: "${ROV_ROOT:=hangar-root}"

# The camera's own H.264 for --video: its V4L2 node (the lab's USB camera, 32e4:9422,
# has H.264 on /dev/video2 and MJPEG on /dev/video0), or an encoder source as is
# (file:/path.h264 for a rehearsal).
: "${H264_NODE:=/dev/video2}"

# The lab's own electric-eye, stopped for --video (it holds the camera and sends to the
# laptop's 5610 too) and started again by down.
: "${LAB_SERVICES:=eeye hellion}"

# lab.sh freeze (README "Freeze and thaw"): the timers stopped and masked until the next
# boot, the units masked the same way (what runs in one is asked to end by its own
# signal, never by systemctl), the governor, and how long a running upgrade is waited
# for. LAB_SERVICES above are stopped too, and started again by thaw if they ran.
: "${LAB_FREEZE_TIMERS:=apt-daily.timer apt-daily-upgrade.timer}"
: "${LAB_FREEZE_UNITS:=apt-daily.service apt-daily-upgrade.service}"
: "${LAB_FREEZE_GOVERNOR:=performance}"
: "${LAB_FREEZE_WAIT:=900}"

# The Pixhawk on the Pi, device and rate: what the MAVROS relay opens, and with
# up --serial the mavlink module itself.
: "${FCU:=/dev/ttyACM0:115200}"

# Units of the lab's own on the Pi that hold the Pixhawk's serial line, stopped for
# up --serial and started again by down, as LAB_SERVICES are for --video. None: the lab's
# MAVROS is installed and does not run by itself (2026-11-09). If up --serial finds the
# line held, it stops and names the holder and its unit: put the unit here.
: "${LAB_SERIAL_SERVICES:=}"

# The tether bridge's UDP port (up --bridge), the same on both ends; this laptop's
# firewall must let it in from the Pi.
: "${BRIDGE_PORT:=5614}"

# The laptop's ports: the two Dawn Patrol consoles, tunnelled from the Pi, and the page
# of the laptop's hellion.
: "${CONSOLE_VEHICLE_PORT:=18080}"
: "${CONSOLE_TOPSIDE_PORT:=18081}"
: "${HELLION_CONTROL_PORT:=8092}"

# Where bench writes, and where lab.sh keeps the session's state (what up changed, so
# that down puts it back) and its SSH connection.
: "${RESULTS_DIR:=$HOME/hangar-results}"
: "${LAB_STATE_DIR:=$HOME/.cache/hangar-lab}"

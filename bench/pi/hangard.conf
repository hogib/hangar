# hangard.conf for a run out of one directory, $HANGAR_ROOT (bench/PI-TEST.md):
# nothing under /etc, /usr or /var. The keys are docs/03-manager.md "Running
# it"; a key left out keeps its default there. @ROOT@ is replaced by
# share/hangar/install-root.sh.
Role=vehicle
ModuleDir=@ROOT@/etc/modules
MsgDir=@ROOT@/share/hangar/msg
TopicDir=/dev/shm/hangar
DatasetDir=@ROOT@/share/hangar/datasets
RecordingDir=@ROOT@/var/recordings
LogFallbackDir=@ROOT@/log

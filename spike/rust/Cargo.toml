[workspace]
members = ["hangar", "manager", "programs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The same build at opt-level 3, for the size comparison.
[profile.release-o3]
inherits = "release"
opt-level = 3

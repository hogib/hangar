# /etc/hangar/topside_mavlink.conf: the topside's MAVLink module (modules/mavlink/README.md).
[Link]
# Until the bridge both roles run on the vehicle's Pi, so this module sends across the
# tether to QGroundControl on the laptop (Fathom-X: the Pi 192.168.2.10, the laptop
# 192.168.2.1); tools/rov/rov.sh takes ROV_IP and GCS_IP to change them.
Bind=192.168.2.10:14650
GCS=192.168.2.1:14550
# The vehicle QGroundControl sees: system 1, a submarine with a generic autopilot
# (Autopilot=ardupilot presents ArduPilot instead, if a QGC version needs it to
# enable the joystick: README, "What QGroundControl needs").
SysId=1
CompId=1
Autopilot=generic
# Pilot input older than this counts as zero.
InputTimeout=500ms
# until the bridge: the link counts as up while safety.state keeps arriving.
LinkTimeout=2s

# What a button does (docs/10 "Buttons"): arm, disarm, or pass (its bit in
# pilot.buttons while held). A button with no section does nothing.
[Button 2]
Function=arm

[Button 3]
Function=disarm

[Button 6]
Function=pass

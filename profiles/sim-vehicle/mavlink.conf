# /etc/hangar/mavlink.conf: the vehicle's MAVLink module (modules/mavlink/README.md).
[Link]
# ArduSub is a UDP client to this address (docs/10 "ArduSub as a module"); its own
# address is learned from its first packet, or named with Peer=host:port.
# The development machine: MAVProxy's second output (tools/sim/launch.sh under
# HANGAR_SIM=1) sends SITL's MAVLink here; in production ArduSub sends to 14660.
Bind=127.0.0.1:14560
# MAVLink 2 signing with /etc/hangar/mavlink.key, 32 bytes raw or 64 hex digits.
# SITL and MAVProxy are not set up with a key: the link to the container is
# unsigned here, signed on the vehicle (README, "What waits for the vehicle").
Signing=no
KeyFile=/etc/hangar/mavlink.key
# The ground station's id the module presents: SYSID_MYGCS. The value in
# ardusub.params, when the file names it, takes precedence.
SysId=255
CompId=190
# ArduSub's system id; 0 learns it from its HEARTBEAT.
TargetSysId=1
# ArduSub's component, the autopilot (1). Frames from another component of the same
# system (MAVROS heartbeats as system 1 by default) are dropped and counted as
# other-component; 0 takes any.
TargetCompId=1
# until the recorder: a .tlog of every frame both ways, pymavlink's format; empty for none.
Tlog=/dev/shm/hangar-vehicle/var/lib/hangar/mavlink/sitl.tlog

[Params]
File=/etc/hangar/ardusub.params

[Depth]
# depth = (press_abs - SurfacePressure) / (FluidDensity * g), from SCALED_PRESSURE2
# (the external sensor) by default; From=SCALED_PRESSURE for a build that reports
# the depth sensor there.
FluidDensity=1000
SurfacePressure=1013.25
From=SCALED_PRESSURE2

# The rates asked of ArduSub, in Hz; 0 does not ask.
[Telemetry ATTITUDE]
Rate=50

[Telemetry SCALED_IMU]
Rate=50

[Telemetry SCALED_PRESSURE2]
Rate=50

[Telemetry SYS_STATUS]
Rate=2

[Telemetry BATTERY_STATUS]
Rate=2

[Telemetry SERVO_OUTPUT_RAW]
Rate=50

# /etc/hangar/pairer.conf: the development demo's pairer (docs/06-recorder.md,
# "Live: the pairer"; modules/pairer/README.md). Manifest syntax, parsed as
# strictly.
[Pairer]
# The specs served, by name: DatasetDir/<name>.dataset, each also an output
# dataset.<name> of pairer.module.
Datasets=wrench_state
DatasetDir=/etc/hangar/datasets
# until the bridge: the rows also go to <Sink>/dataset.<name>.hgr, the same bytes
# as the topic, so a trainer on this machine has them as a file (pairer README,
# deviation 2). The pairer's own state directory, which the manager makes; the
# file starts over at each start. hangar-up.sh rewrites /dev/shm/hangar-vehicle
# to the vehicle root it lays out.
Sink=/dev/shm/hangar-vehicle/var/lib/hangar/pairer

# /etc/hangar/recorder.conf: the development demo's recorder (docs/06-recorder.md,
# "What it records" and "Sessions"; modules/recorder/README.md). Manifest syntax,
# parsed as strictly; a size is a power of 1024 (32MB).
[Recorder]
# A session while the vehicle is armed: safety.state 1 starts one, the message
# that leaves it stops it (docs/06, Sessions). recorder.start and .stop work
# beside it.
AutoStart=armed
# Under the vehicle root: tools/sim/hangar-up.sh rewrites /dev/shm/hangar-vehicle
# to the root it lays out, as it does mavlink.conf's Tlog. The recorder makes the
# directory, mode 2770, if it is not there.
Dir=/dev/shm/hangar-vehicle/var/lib/hangar/recorder/sessions
# The roots are on tmpfs: the default 1GB would stop sessions on a small machine.
MinFree=256MB
# The black box: the last minute of every topic in RAM, written on failsafe, on a
# module's exit and on recorder.dump.
BlackBox=60s
BlackBoxMemory=32MB

# [Record <glob>] sections are matched in order; the first that matches a topic
# sets its keys. Policy: full, every:N, rate:<Hz>, meta, off (default full; meta
# for a frame topic, of which this profile has none: no camera). BlackBox class:
# high, normal, low, off (default high for an event topic, normal for a rated one,
# off for dataset.*).

# The vehicle's state at 10 Hz, ArduSub's at 10 Hz, the battery at 2 Hz: small,
# and what an incident is read from. Kept whole in the black box before anything
# else, with the event topics (the requests, replies, parameters, the manager's).
[Record safety.state]
BlackBox=high

[Record mux.state]
BlackBox=high

[Record ardusub.state]
BlackBox=high

[Record power.battery]
BlackBox=high

# The 50 Hz telemetry (nav.attitude, nav.imu, nav.depth), the commands
# (pilot.wrench through the shim, ctl.wrench, ardusub.manual_control) and what
# the thrusters were sent (thr.out): every message, since a dataset is built
# only from topics recorded full (docs/06, Offline). Normal class: they share
# what the state topics leave of the 32MB.
[Record nav.*]
Policy=full
BlackBox=normal

[Record pilot.*]
Policy=full
BlackBox=normal

[Record ctl.wrench]
Policy=full
BlackBox=normal

[Record ardusub.manual_control]
Policy=full
BlackBox=normal

[Record thr.out]
Policy=full
BlackBox=normal

# Everything else: every .req, .rep and .params topic, the manager's
# hangar.vehicle.system, .modules and .admin.req, the recorder's own topics, the
# topside's through the shim.
[Record *]
Policy=full

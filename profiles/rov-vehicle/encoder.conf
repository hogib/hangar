# /etc/hangar/encoder.conf (profiles/rov-vehicle): the camera's own H.264 from the
# lab's BlueROV2 to the laptop (modules/encoder/README.md; tools/rov/README.md,
# "The camera's own H.264"). Laid out always, used only with ENCODER=1.
[Encoder]
# UNVERIFIED: which of the camera's nodes offers H.264, if any. The lab's camera is
# USB 32e4:9422 ("H264 USB Camera"); on 2026-11-19 it had /dev/video0 to /dev/video3
# among the Pi's nodes. Before the first run, on the Pi:
#   for d in /dev/video[0-9]; do echo "== $d"; v4l2-ctl -d $d --list-formats-ext | grep -B1 -A3 H264; done
# and put the node that lists H264 here.
Source=uvc:/dev/video0
# The laptop on the tether (rov.sh's GCS_IP replaces the address): electric-eye's
# hellion in placement A there receives on 5610.
Peer=192.168.2.1:5610
Width=1280
Height=720
FrameRate=30
MaxPacket=1200
PayloadType=96
KeyframeInterval=1s

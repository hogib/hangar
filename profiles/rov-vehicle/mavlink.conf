# /etc/hangar/mavlink.conf (profiles/rov-vehicle): the vehicle's MAVLink module (modules/mavlink/README.md).
[Link]
# The lab's BlueROV2: ArduSub runs on a Pixhawk on USB (/dev/ttyACM0), and MAVROS on
# the Pi relays it to this address over UDP (tools/rov/rov.sh relay, from
# 127.0.0.1:14555). The module speaks UDP only; its peer is learned from the first packet.
Bind=127.0.0.1:14560
# MAVLink 2 signing with /etc/hangar/mavlink.key, 32 bytes raw or 64 hex digits.
# Not on the bench yet: the Pixhawk has no key, and the relay passes frames as they
# are. Signing against the real ArduSub is still to be tried.
Signing=no
KeyFile=/etc/hangar/mavlink.key
# The ground station's id the module presents: SYSID_MYGCS. The value in
# ardusub.params, when the file names it, takes precedence.
SysId=255
CompId=190
# ArduSub's system id; 0 learns it from its HEARTBEAT.
TargetSysId=1
# ArduSub's component, the autopilot (1). Frames from another component of the same
# system (MAVROS heartbeats as system 1 by default) are dropped and counted as
# other-component; 0 takes any.
TargetCompId=1
# until the recorder: a .tlog of every frame both ways, pymavlink's format; empty for none.
Tlog=/var/lib/hangar/mavlink/rov.tlog

[Params]
File=/etc/hangar/ardusub.params

[Depth]
# depth = (press_abs - SurfacePressure) / (FluidDensity * g), from SCALED_PRESSURE2
# (the external sensor) by default; From=SCALED_PRESSURE for a build that reports
# the depth sensor there. The lab's vehicle (2026-11-09) reported no SCALED_PRESSURE2:
# no external depth sensor, so depth comes from the Pixhawk's own barometer, which
# reads the air on the bench (a few centimetres either way from the weather).
FluidDensity=1000
SurfacePressure=1013.25
From=SCALED_PRESSURE

# The rates asked of ArduSub, in Hz; 0 does not ask.
[Telemetry ATTITUDE]
Rate=50

[Telemetry SCALED_IMU]
Rate=50

[Telemetry SCALED_PRESSURE]
Rate=50

[Telemetry SYS_STATUS]
Rate=2

[Telemetry BATTERY_STATUS]
Rate=2

[Telemetry SERVO_OUTPUT_RAW]
Rate=50

# /etc/hangar/topside_encoder.conf: the pilot's picture to QGroundControl
# (modules/topside_encoder/README.md; docs/11-electric-eye.md "encoder"). The
# bitrate is a parameter, live: hangar param set topside_encoder bitrate_kbps=2000.
[TopsideEncoder]
# The frame topic encoded: cam.pilot (vision's), or cam.decoded (video_relay's)
# while vision does not run.
Source=cam.pilot
# QGroundControl's video in (its default, UDP h.264 on 5600).
Peer=127.0.0.1:5600
# The frame topic's nominal rate: the RTP timestamps (frame seq times 90000/rate)
# and x264's rate control.
FrameRate=30
KeyInterval=30
MaxPacket=1200
PayloadType=96
# x264's sliced threads; 0 lets it choose.
Threads=0
# One message a frame sent: its frame, RTP timestamp, size, keyframe or not.
Index=topside_video.index

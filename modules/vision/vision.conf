# /etc/hangar/vision.conf: the vision module (modules/vision/README.md).
[Vision]
# The frame topic read and the one written. The manifest's [Subscribe] and
# Inputs= name the same input.
Input=cam.decoded
Output=cam.pilot

# The five presets every vision module has (normal, auto, edges, sharpen,
# lowlight) can be redefined here, and up to eleven more added; the `preset`
# parameter selects one by name, "custom" the eight stages of the parameters.
# Chain= is stages separated by blanks, each an operator and its settings:
#   grayscale  invert  contrast
#   threshold:value=N   tint:u=N,v=N,strength=N   sobel:threshold=N
#   blur:strength=N     light:level=N             log:strength=N,threshold=N
#   canny:strength=N,low=N,high=N
# For example, edges drawn harder than the built-in one:
#
# [Preset edges]
# Auto=no
# Chain=blur:strength=3 sobel:threshold=32

# /etc/hangar/recorder.conf: the recorder's settings (docs/06-recorder.md,
# "What it records" and "Sessions"; modules/recorder/README.md). Manifest
# syntax, parsed as strictly. Sizes are powers of 1024: 32MB.
[Recorder]
# boot: always recording. armed: while the vehicle is armed (safety.state).
# manual: only by recorder.start.
AutoStart=armed
# Dir=/var/lib/hangar/recordings
# MinFree=1GB
# BlackBox=60s
BlackBoxMemory=32MB
# The bounded buffer between the drain loop and the writer thread (README).
# WriteBuffer=16MB

# [Record <glob>] sections are matched in order; the first that matches a
# topic sets its keys. Policy: full, every:N, rate:<Hz>, meta, off.
# BlackBox: off, low, normal, high.

# The small frame made for networks, in full; the large frames as headers only.
[Record cam.nn]
Policy=full

[Record cam.*]
Policy=meta

[Record *]
Policy=full

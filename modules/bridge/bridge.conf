# /etc/hangar/bridge.conf: the tether bridge (docs/08-bridge.md "Configuration",
# modules/bridge/README.md). One file, the same on both sides but for Peer=;
# `up` is from the vehicle to the topside. The key: 32 random bytes (or 64 hex
# digits) in /etc/hangar/bridge.key, the same on both, readable by hg-bridge:
#   head -c 32 /dev/urandom > /etc/hangar/bridge.key
[Bridge]
Pair=default
Key=/etc/hangar/bridge.key
Port=5614
MaxRate=20Mbit
# Peer=auto finds the other side by its beacon on UDP 5613. On the lab's
# tether, fixed: the vehicle's Pi (192.168.2.10) names Peer=192.168.2.1, the
# topside laptop Peer=192.168.2.10; the one key that may differ.
Peer=auto

[Mirror safety.state bridge.vehicle.link]
Direction=up
Priority=safety
ExpectRate=10
StaleAfter=300ms

[Mirror hangar.vehicle.system hangar.vehicle.modules]
Direction=up
Priority=safety
ExpectRate=1
StaleAfter=3s

# pilot.buttons is published with every pilot.wrench.
[Mirror pilot.wrench pilot.buttons]
Direction=down
Priority=command
ExpectRate=50
StaleAfter=100ms
MaxAge=100ms

# What the topside shows the pilot and the operator, and re-emits to QGroundControl.
[Mirror nav.* power.battery vehicle.leak mux.state ardusub.state recorder.status *.params]
Direction=up
Rate=10

# One message per frame: the topside's video_relay pairs it with the RTP stream.
[Mirror video.index]
Direction=up

# Event topics whose every message matters.
[Mirror ardusub.param policy.*.active policy.*.load]
Direction=up
Delivery=reliable

# Trained weights for a policy (docs/09): what the topside's trainer, or an
# operator, sends with bridge.send lands on the vehicle in
# /var/lib/hangar/bridge/files/policy_depth_ff/.
[Files policy_depth_ff]
Direction=down
MaxSize=16MB
Allow=trainer admin

[Calls]
Remote=safety.* mux.* recorder.* mavlink.setup installer.* *.set_params policy_*.*

# /etc/hangar/video_relay.conf: video_relay (modules/video_relay/README.md).
[VideoRelay]
# The tether's video port: the encoder's Peer= on the vehicle (5610).
Bind=5610
# Where every packet is also sent, unchanged: QGroundControl's video in. Empty
# for none; several, blank-separated.
Relay=127.0.0.1:5600
# The encoder's frame rate and payload type: the RTP timestamp is the frame's
# number times 90000 / FrameRate.
FrameRate=30
PayloadType=96
# The vehicle's topic whose seqs the frame numbers are: the encoder's
# video.index, as cam.decoded's Inputs= in the manifest says.
Frames=vehicle:video.index
# Decode into cam.decoded, with this many slice threads.
Decode=yes
Threads=2
# The recorder session topic followed: a session starting is a recording into
# its video/. Empty for none.
Session=topside_recorder.session
# Record always, into this directory, from the start; empty for none.
RecordDir=
Name=video_relay

# /etc/hangar/encoder.conf: the encoder (modules/encoder/README.md). Manifest
# syntax, read as strictly: an unknown key or a bad value ends the module with
# status 78, saying which.
[Encoder]
# uvc:/dev/videoN, the camera's own H.264 (V4L2_PIX_FMT_H264): one of a UVC
# camera's nodes offers it, if any does; `v4l2-ctl -d /dev/videoN
# --list-formats-ext` on each says which. file:<path> sends an Annex B file,
# paced at FrameRate (tests, the bench).
Source=uvc:/dev/video2
# The topside's video port: electric-eye's hellion (placement A) or, later,
# video_relay, both on 5610.
Peer=192.168.2.1:5610
# Asked of the camera, which may give another size (the log says so).
Width=1280
Height=720
# The nominal rate: the RTP timestamp of frame n is n x 90000 / FrameRate.
FrameRate=30
# RTP packets, the 12-byte header included: 1200 leaves room in a 1500-byte MTU.
MaxPacket=1200
PayloadType=96
# A keyframe is asked of the camera when none has come for this long; 0 never.
KeyframeInterval=1s
# Source=file: only: start again at the end of the file.
Loop=no
